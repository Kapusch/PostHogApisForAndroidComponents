name: Native SDK package qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install android
      - run: python3 scripts/verify-public.py
      - run: bash src/Kapusch.PostHogApisForAndroidComponents/Native/Android/build.sh
      - run: dotnet pack src/Kapusch.PostHogApisForAndroidComponents/Kapusch.PostHogApisForAndroidComponents.csproj -c Release -o artifacts/nuget
      - run: python3 scripts/verify-package.py
      - run: dotnet build samples/Smoke/Smoke.csproj -c Release 
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdk-qualification
          path: artifacts/nuget/*.nupkg
